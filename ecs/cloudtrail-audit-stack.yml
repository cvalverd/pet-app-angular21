AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Regional CloudTrail management-event trail for the pet API deployment; stores private
  S3 logs for 90 days with SSE-S3 and public access blocked.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@v3
  com.aws.cloudformation.Context:
    arch: CloudTrail management events in us-east-1 -> private S3 bucket
    must:
      - Capture management events only; do not enable data-event selectors.
      - Keep the log bucket private, encrypted, and protected from accidental deletion.
      - Allow S3 writes only from this trail and this account.
    ref:
      - at: ../README.md
        has: audit trail setup and retention policy
        scope: deployment
Resources:
  AuditLogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: retain CloudTrail files in a private bucket with bounded storage duration
        must:
          - Keep all four public access blocks enabled.
          - Keep default SSE-S3 encryption and versioning enabled.
          - Retain the bucket if its CloudFormation stack is removed.
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireCloudTrailLogsAfter90Days
            Status: Enabled
            Filter:
              Prefix: AWSLogs/
            ExpirationInDays: 89
            NoncurrentVersionExpiration:
              NoncurrentDays: 1

  AuditLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: allow only this account's CloudTrail service to deliver logs; deny insecure S3 transport
        must:
          - Scope CloudTrail writes to this trail ARN and this account's AWSLogs prefix.
          - Deny all bucket access over insecure transport.
    Properties:
      Bucket: !Ref AuditLogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt AuditLogBucket.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${AWS::StackName}-management'
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${AuditLogBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${AWS::StackName}-management'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt AuditLogBucket.Arn
              - !Sub '${AuditLogBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  AuditTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn:
      - AuditLogBucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: durably record regional control-plane changes for the ECS/API deployment
        must:
          - Keep logging enabled for all read/write management events in us-east-1.
          - Keep data-event selectors disabled to limit scope and cost.
          - Retain the trail if its CloudFormation stack is removed.
    Properties:
      TrailName: !Sub '${AWS::StackName}-management'
      S3BucketName: !Ref AuditLogBucket
      EnableLogFileValidation: true
      IncludeGlobalServiceEvents: true
      IsLogging: true
      IsMultiRegionTrail: false
      EventSelectors:
        - IncludeManagementEvents: true
          ReadWriteType: All

Outputs:
  TrailArn:
    Description: ARN of the regional CloudTrail management-event trail.
    Value: !GetAtt AuditTrail.Arn
  LogBucketName:
    Description: Private S3 bucket retaining CloudTrail logs for 90 days.
    Value: !Ref AuditLogBucket
