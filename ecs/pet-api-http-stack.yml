AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Pet API on Fargate behind a public HTTP load balancer for a temporary demo; Oracle
  connection material is injected from Secrets Manager.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@v3
  com.aws.cloudformation.Context:
    arch: public ALB HTTP -> ECS Fargate -> Oracle Autonomous Database
    must:
      - Public HTTP is demo-only; do not use real or sensitive data because traffic is unencrypted and the API has no authentication.
      - Keep ECS task ingress limited to the ALB security group.
      - Inject DB credentials and wallet only from Secrets Manager; never place values in this template.
      - Keep the Oracle wallet out of the container image and source repository.
    ref:
      - at: ../README.md
        has: deployment workflow, secret names and operational constraints
        scope: deployment
Parameters:
  ClusterName:
    Type: String
    AllowedPattern: '^[A-Za-z0-9_-]{1,255}$'
    Description: Existing ECS cluster name.
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two public subnets in distinct Availability Zones.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC that contains the public subnets.
  BackendImage:
    Type: String
    AllowedPattern: '^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/pet-api-oracle:[0-9a-f]{40}$'
    Description: Immutable backend ECR image URI tagged with its commit SHA.
  ExecutionRoleArn:
    Type: String
    AllowedPattern: '^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$'
    Description: Existing ECS task execution role with ECR, Logs, and secret read permissions.
  OracleCredentialsSecretArn:
    Type: String
    AllowedPattern: '^arn:aws:secretsmanager:us-east-1:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$'
    Description: Secret JSON containing DB_URL, DB_USERNAME, and DB_PASSWORD.
  OracleWalletSecretArn:
    Type: String
    AllowedPattern: '^arn:aws:secretsmanager:us-east-1:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$'
    Description: Secret containing the Base64-encoded Oracle wallet ZIP.
  DeploymentNonce:
    Type: String
    AllowedPattern: '^[A-Za-z0-9-]{1,64}$'
    Description: Unique deployment identifier used to refresh tasks and their injected secrets.
Resources:
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: retain concise API runtime logs for deployment diagnosis
        must:
          - Keep retention bounded for the temporary Academy environment.
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}'
      RetentionInDays: 7

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: expose the demo API through the ALB over plain HTTP as required by the Academy permissions available
        must:
          - Keep this configuration demo-only; requests and responses are unencrypted and the API has no authentication.
          - Allow only TCP port 80 from the public Internet; do not expose the task port directly.
          - Do not attach this group to ECS tasks or unrelated resources.
    Properties:
      GroupDescription: Public HTTP access to the demo pet API.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: Public HTTP for the temporary demo; no TLS.
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  ApiTaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: isolate the API task; only the ALB may connect to its application port
        must:
          - Keep inbound port 8080 scoped to LoadBalancerSecurityGroup.
    Properties:
      GroupDescription: Pet API tasks; accept traffic only from the load balancer.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: Application traffic from the API load balancer.
          IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !GetAtt LoadBalancerSecurityGroup.GroupId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  ApiLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Metadata:
      com.aws.cloudformation.Context:
        why: public HTTP endpoint for a temporary demo because CloudFront is not authorized in the Academy account
        must:
          - Keep this endpoint demo-only; all viewer-to-API traffic is unencrypted.
    Properties:
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      Subnets: !Ref PublicSubnetIds
      SecurityGroups:
        - !GetAtt LoadBalancerSecurityGroup.GroupId

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: route HTTP requests to Fargate task ENIs and verify the API can serve pet data
        must:
          - Target type must remain ip for awsvpc Fargate tasks.
          - Health path /pets requires the Oracle database to be reachable.
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /pets
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'

  ApiListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Metadata:
      com.aws.cloudformation.Context:
        why: forward public HTTP requests to the API target group without an HTTPS termination layer
        must:
          - Keep this HTTP-only listener for temporary demo use; never send sensitive data.
          - Forward requests only to the API target group.
    Properties:
      LoadBalancerArn: !Ref ApiLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Metadata:
      com.aws.cloudformation.Context:
        why: run the existing Java 21 API image on Fargate with least runtime access and Secrets Manager injection
        must:
          - Do not set taskRoleArn; the API does not call AWS APIs.
          - Keep the wallet and database credentials in Secrets Manager references only.
          - Keep execution-role access limited to required ECR, Logs, and secret retrieval.
    Properties:
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '512'
      Memory: '1024'
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !Ref ExecutionRoleArn
      ContainerDefinitions:
        - Name: pet-api
          Image: !Ref BackendImage
          Essential: true
          Environment:
            - Name: TNS_ADMIN
              Value: /app/wallet
            - Name: DEPLOYMENT_ID
              Value: !Ref DeploymentNonce
          Secrets:
            - Name: DB_URL
              ValueFrom: !Sub '${OracleCredentialsSecretArn}:DB_URL::'
            - Name: DB_USERNAME
              ValueFrom: !Sub '${OracleCredentialsSecretArn}:DB_USERNAME::'
            - Name: DB_PASSWORD
              ValueFrom: !Sub '${OracleCredentialsSecretArn}:DB_PASSWORD::'
            - Name: ORACLE_WALLET_BASE64
              ValueFrom: !Ref OracleWalletSecretArn
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs

  ApiService:
    Type: AWS::ECS::Service
    Metadata:
      com.aws.cloudformation.Context:
        why: keep one API task available behind the load balancer for temporary public demo access
        must:
          - Use public subnets for outbound Oracle and ECR connectivity; task ingress remains ALB-only.
          - Use a deployment circuit breaker with rollback.
    Properties:
      Cluster: !Ref ClusterName
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      HealthCheckGracePeriodSeconds: 180
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !GetAtt ApiTaskSecurityGroup.GroupId
          Subnets: !Ref PublicSubnetIds
      LoadBalancers:
        - ContainerName: pet-api
          ContainerPort: 8080
          TargetGroupArn: !Ref ApiTargetGroup
      TaskDefinition: !Ref ApiTaskDefinition

Outputs:
  ApiBaseUrl:
    Description: Public HTTP base URL for the API; append /pets. Demo only; traffic is unencrypted.
    Value: !Sub 'http://${ApiLoadBalancer.DNSName}'
  ApiServiceName:
    Description: ECS API service logical deployment name.
    Value: !Ref ApiService
