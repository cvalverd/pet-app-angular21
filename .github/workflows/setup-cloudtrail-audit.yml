name: Set up CloudTrail audit logging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: setup-cloudtrail-audit
  cancel-in-progress: false

jobs:
  setup:
    if: github.ref == 'refs/heads/main'
    name: Validate and configure regional CloudTrail
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "622519216316"
      STACK_NAME: pet-api-cloudtrail-audit
      TEMPLATE_FILE: ecs/cloudtrail-audit-stack.yml

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned CloudFormation linter
        run: python -m pip install --disable-pip-version-check --no-input cfn-lint==1.60.0

      - name: Lint CloudTrail stack
        run: cfn-lint --format json --regions="$AWS_REGION" "$TEMPLATE_FILE"

      - name: Install and verify cfn-guard
        shell: bash
        run: |
          archive="$RUNNER_TEMP/cfn-guard.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/aws-cloudformation/cloudformation-guard/releases/download/3.2.1/cfn-guard-v3-x86_64-ubuntu-latest.tar.gz \
            --output "$archive"
          echo "09c2b8cfd81d513374a8da89d4805dc55006a3da52bbf598e272022d4d198e94  $archive" \
            | sha256sum --check
          mkdir -p "$RUNNER_TEMP/cfn-guard"
          tar -xzf "$archive" -C "$RUNNER_TEMP/cfn-guard"
          guard_binary="$(find "$RUNNER_TEMP/cfn-guard" -type f -name 'cfn-guard*' -print -quit)"
          if [[ -z "$guard_binary" ]]; then
            echo "::error::The cfn-guard release archive did not contain its executable."
            exit 1
          fi
          chmod +x "$guard_binary"
          echo "CFN_GUARD_BIN=$guard_binary" >> "$GITHUB_ENV"
          "$guard_binary" --version

      - name: Check CloudTrail stack security rules
        run: >-
          "$CFN_GUARD_BIN" validate
          --rules ecs/cfn-guard/cloudtrail_audit.guard
          --data "$TEMPLATE_FILE"
          --output-format json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify account and inspect existing CloudTrail trails
        shell: bash
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$account_id" != "$AWS_ACCOUNT_ID" ]]; then
            echo "::error::Credentials point to account $account_id, not $AWS_ACCOUNT_ID."
            exit 1
          fi

          trails="$(aws cloudtrail describe-trails \
            --include-shadow-trails --region "$AWS_REGION" --output json)"
          jq -c '[.trailList[]? | {
            Name, TrailARN, HomeRegion, IsMultiRegionTrail,
            IsOrganizationTrail, LogFileValidationEnabled,
            S3BucketName, S3KeyPrefix
          }]' <<< "$trails"
          mapfile -t trail_entries < <(
            jq -r --arg region "$AWS_REGION" \
              '.trailList[]
               | select(.IsMultiRegionTrail == true or .HomeRegion == $region)
               | [.TrailARN, (.HomeRegion // $region)] | @tsv' \
              <<< "$trails"
          )
          trail_ready=false

          for trail_entry in "${trail_entries[@]}"; do
            IFS=$'\t' read -r trail_arn trail_region <<< "$trail_entry"
            status="$(aws cloudtrail get-trail-status \
              --name "$trail_arn" --region "$trail_region" --output json)"
            selectors="$(aws cloudtrail get-event-selectors \
              --trail-name "$trail_arn" --region "$trail_region" --output json)"
            echo "Trail status record: $(jq -c . <<< "$status")"
            echo "Trail selector record: $(jq -c . <<< "$selectors")"

            if [[ "$(jq -r '.IsLogging' <<< "$status")" != "true" ]]; then
              continue
            fi
            if jq -e '
              any(.EventSelectors[]?;
                .IncludeManagementEvents == true
                and (.ReadWriteType == "All" or .ReadWriteType == "WriteOnly")
                and ((.ExcludeManagementEventSources // []) | index("cloudformation.amazonaws.com") == null))
              or any(.AdvancedEventSelectors[]?;
                any(.FieldSelectors[]?;
                  .Field == "eventCategory" and ((.Equals // []) | index("Management") != null))
                and all(.FieldSelectors[]?;
                  .Field == "eventCategory" or .Field == "eventSource")
                and all(.FieldSelectors[]?; .Field != "eventSource"
                  or (
                    (
                      ((.Equals // []) | length) == 0
                      and ((.StartsWith // []) | length) == 0
                      and ((.EndsWith // []) | length) == 0
                      and ((.NotEquals // []) | length) == 0
                      and ((.NotStartsWith // []) | length) == 0
                      and ((.NotEndsWith // []) | length) == 0
                    )
                    or (
                      ((.Equals // []) | index("cloudformation.amazonaws.com") != null)
                      and ((.StartsWith // []) | length) == 0
                      and ((.EndsWith // []) | length) == 0
                      and ((.NotEquals // []) | length) == 0
                      and ((.NotStartsWith // []) | length) == 0
                      and ((.NotEndsWith // []) | length) == 0
                    )
                  ))
            ' >/dev/null <<< "$selectors"; then
              trail_ready=true
              echo "An active trail already records CloudFormation management events in $AWS_REGION."
            fi
          done

          if [[ "$trail_ready" == "true" ]]; then
            exit 0
          fi
          if (( ${#trail_entries[@]} > 0 )); then
            echo "::error::Existing trail(s) were found, but none passed the audit check. No resources were changed to avoid creating a duplicate trail."
            exit 1
          fi
          echo "No trail exists in $AWS_REGION or as a multi-Region trail; checking bootstrap permissions."

          denied="$(aws iam simulate-principal-policy \
            --policy-source-arn "arn:aws:iam::$AWS_ACCOUNT_ID:role/voclabs" \
            --action-names \
              cloudformation:CreateChangeSet cloudformation:ExecuteChangeSet \
              cloudformation:DescribeStacks cloudformation:DescribeChangeSet \
              cloudformation:DescribeEvents cloudtrail:CreateTrail \
              cloudtrail:GetTrailStatus cloudtrail:StartLogging \
              s3:CreateBucket s3:PutBucketPolicy s3:PutEncryptionConfiguration \
              s3:PutPublicAccessBlock s3:PutBucketVersioning \
              s3:PutLifecycleConfiguration s3:PutBucketOwnershipControls \
            --resource-arns '*' \
            --query 'EvaluationResults[?EvalDecision!=`allowed`].{Action:EvalActionName,Decision:EvalDecision}' \
            --output json)"
          if [[ "$denied" != "[]" ]]; then
            echo "::error::The current Academy session is missing permissions required to create the audit trail."
            echo "$denied"
            exit 1
          fi

          if stack_details="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" --region "$AWS_REGION" --output json 2>&1)"; then
            echo "::error::The audit stack already exists but no active trail passed verification. Review it before changing anything."
            echo "$stack_details"
            exit 1
          elif [[ "$stack_details" != *"does not exist"* ]]; then
            echo "$stack_details"
            exit 1
          fi

      - name: Create and validate CloudTrail change set
        shell: bash
        run: |
          change_set_name="bootstrap-audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          change_set_id="$(aws cloudformation create-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$change_set_name" \
            --change-set-type CREATE \
            --template-body "file://$TEMPLATE_FILE" \
            --region "$AWS_REGION" \
            --query Id --output text)"
          echo "CHANGE_SET_ID=$change_set_id" >> "$GITHUB_ENV"

          if ! aws cloudformation wait change-set-create-complete \
            --change-set-name "$change_set_id" --region "$AWS_REGION"; then
            aws cloudformation describe-events \
              --change-set-name "$change_set_id" --region "$AWS_REGION" --output json || true
            aws cloudformation describe-change-set \
              --change-set-name "$change_set_id" --region "$AWS_REGION" \
              --query '{Status:Status,StatusReason:StatusReason}' --output json || true
            exit 1
          fi

          aws cloudformation describe-events \
            --change-set-name "$change_set_id" --region "$AWS_REGION" \
            --query 'OperationEvents[?ValidationStatus!=null].{Type:ValidationType,Status:ValidationStatus,Name:ValidationName,Properties:ValidationProperties}' \
            --output json

      - name: Execute CloudTrail change set
        shell: bash
        run: |
          aws cloudformation execute-change-set \
            --change-set-name "$CHANGE_SET_ID" --region "$AWS_REGION"
          aws cloudformation wait stack-create-complete \
            --stack-name "$STACK_NAME" --region "$AWS_REGION"

      - name: Verify CloudTrail logging
        shell: bash
        run: |
          trail_name="${STACK_NAME}-management"
          trail_arn="$(aws cloudtrail describe-trails \
            --trail-name-list "$trail_name" --region "$AWS_REGION" \
            --query 'trailList[0].TrailARN' --output text)"
          status="$(aws cloudtrail get-trail-status \
            --name "$trail_arn" --region "$AWS_REGION" --output json)"
          selectors="$(aws cloudtrail get-event-selectors \
            --trail-name "$trail_arn" --region "$AWS_REGION" --output json)"
          echo "Created trail status: $(jq -c . <<< "$status")"
          echo "Created trail selectors: $(jq -c . <<< "$selectors")"
          jq -e '.IsLogging == true' >/dev/null <<< "$status"
          jq -e 'any(.EventSelectors[]?;
            .IncludeManagementEvents == true and .ReadWriteType == "All")' \
            >/dev/null <<< "$selectors"

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs' --output table
